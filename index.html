<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b92e42">
  <meta name="description" content="An interactive illustrated children's storybook.">
  <title>Storybook Reader</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <a class="brand" href="#" id="homeLink" aria-label="Return to cover">
        <img class="brand-mark" src="./images/apps-for-christ.png" alt="Apps for Christ logo"><span id="brandTitle">Apps For Christ</span>
      </a>
      <button id="readerMenuToggle" class="menu-toggle" type="button"
        aria-expanded="false" aria-controls="readerMenu" aria-label="Open reader menu">
        <span class="menu-icon" aria-hidden="true">☰</span><span class="menu-label">Menu</span>
      </button>
      <div class="top-actions" id="readerMenu">
        <button id="installAppBtn" class="install-app-btn" type="button">Install App</button>
        <button id="printBookBtn" class="quiet-btn" type="button">Print / Save PDF</button>
      </div>
    </header>
    <main class="book-wrap" id="reader">
      <section class="book" aria-label="Storybook reader">
        <div class="page-layout" id="pageLayout">
          <div class="illustration-frame"><img id="pageImage" alt="Story illustration" hidden></div>
          <article class="page-copy">
            <p class="eyebrow" id="pageEyebrow">An interactive storybook</p>
            <h1 id="pageHeading">Storybook</h1>
            <div id="storyText" class="story-text" aria-live="polite"></div>
            <button id="activityToggle" class="activity-toggle" type="button" aria-expanded="false" aria-controls="activity" hidden>Show activity questions <span aria-hidden="true">▾</span></button>
            <div id="activity" class="activity hidden"></div>
          </article>
        </div>
        <div class="reader-controls icon-bar" role="group" aria-label="Story navigation and narration">
          <button id="prevBtn" class="icon-control" type="button" aria-label="Previous page" title="Previous page" disabled><img class="toolbar-icon toolbar-icon-image" src="./images/left-arrow.svg" alt=""></button>
          <button id="nextBtn" class="icon-control primary-icon" type="button" aria-label="Start reading" title="Start reading"><img class="toolbar-icon toolbar-icon-image" src="./images/right-arrow.svg" alt=""></button>
          <button id="listenBtn" class="icon-control listen-icon" type="button" aria-label="Listen" title="Listen"><img class="toolbar-icon toolbar-icon-image" src="./images/listen.svg" alt=""><span class="toolbar-label listen-button-label">Listen</span></button>
          <button id="stopBtn" class="icon-control" type="button" aria-label="Stop narration" title="Stop narration"><img class="toolbar-icon toolbar-icon-image" src="./images/stop.svg" alt=""></button>
        </div>
        <div class="book-topline"><span id="storySubtitle">An interactive storybook</span><span id="pageCount">Cover</span></div>
        <div class="progress-track" aria-label="Reading progress"><span id="progressBar"></span></div>
        <p class="hint" id="readerHint">Tip: swipe left or right to turn pages. Use ← and → on a keyboard.</p>
      </section>
    </main>
    <section id="printBook" class="print-book" aria-label="Printable complete book"></section>
    <footer class="site-footer"><span>Made for little readers</span><span>Reader edition</span></footer>
  </div>
  <script src="reader.js"></script>
  <script>
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(console.error));
    }
  </script>

  <dialog id="installHelpDialog" class="install-help-dialog" aria-labelledby="installHelpTitle">
    <div class="install-help-content">
      <button id="closeInstallHelp" class="install-help-close" type="button" aria-label="Close installation help">×</button>
      <h2 id="installHelpTitle">Install Apps For Christ</h2>
      <p id="installHelpIntro">Add this Reader to your device for quick access.</p>
      <div id="installHelpInstructions"></div>
      <button id="dismissInstallHelp" class="install-help-primary" type="button">Got it</button>
    </div>
  </dialog>
<!-- Code injected by live-server -->
<script>
	// <![CDATA[  <-- For SVG support
	if ('WebSocket' in window) {
		(function () {
			function refreshCSS() {
				var sheets = [].slice.call(document.getElementsByTagName("link"));
				var head = document.getElementsByTagName("head")[0];
				for (var i = 0; i < sheets.length; ++i) {
					var elem = sheets[i];
					var parent = elem.parentElement || head;
					parent.removeChild(elem);
					var rel = elem.rel;
					if (elem.href && typeof rel != "string" || rel.length == 0 || rel.toLowerCase() == "stylesheet") {
						var url = elem.href.replace(/(&|\?)_cacheOverride=\d+/, '');
						elem.href = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_cacheOverride=' + (new Date().valueOf());
					}

		})();

		console.error('Upgrade your browser. This Browser is NOT supported WebSocket for Live-Reloading.');
	}
	// ]]>
</script>
</body>
</html>
